else if(phase==='spell'){let parts=splitWord(w.w),correct=parts[partIndex];let pool=[correct];let candidates=[correct.replace(/[aeiou]/i,'e'),correct.replace(/[aeiou]/i,'a'),correct.replace(/[aeiou]/i,'o'),correct.split('').reverse().join(''),correct+'e',correct.slice(0,-1)+'i','con','tion','in','re','un','er','al','ly','pro','pre','ment'];for(let s of candidates){if(s!==correct&&!pool.includes(s)&&/^[a-z]+$/.test(s))pool.push(s);if(pool.length===4)break}while(pool.length<4)pool.push(['ex','ed','en','or'][pool.length-1]);let shift=(turn+index+partIndex)%4;pool=[...pool.slice(shift),...pool.slice(0,shift)];p.innerHTML=`<div class="eyebrow">BUILD THE WORD · 拼写块</div><div class="chunks">${parts.map((s,i)=>`<div class="chunk ${i>=partIndex?'empty':''}">${i<partIndex?escapeHTML(s):'···'}</div>`).join('')}</div><div class="choices">${pool.map((s,i)=>`<button class="choice" data-choice="${i}">${escapeHTML(s)}</button>`).join('')}</div><div class="actions"><button class="btn secondary" id="replay">🔊 听一遍</button><button class="btn ghost" id="back">再看完整单词</button></div><p class="note">错误 ${wrong} 次 · 答错不扣分，每点一次选项都会刷新。</p>`;p.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let s=pool[Number(b.dataset.choice)];turn++;if(s===correct){beep('correct');partIndex++;if(partIndex>=parts.length){completed(w,wrong===0);phase='done';say(w.w+'. '+d.en)}}else{beep('wrong');wrong++;toast('再试一次，你可以回看剧情')}render()});$('replay').onclick=()=>{beep();say(w.w+'. '+d.en)};$('back').onclick=()=>{beep();phase='intro';spokenFor=-1;render()}}
else{p.innerHTML=`<div class="eyebrow">WELL DONE · 学习完成</div><div class="word" style="color:#83e8c3">${escapeHTML(w.w)} ✓</div><div class="meaning">${escapeHTML(w.zh)}</div><div class="praise-card">🎊 ${praise()}<div style="margin-top:7px">🪙 +10 金币 · 🔥 连续 ${streak} 个</div></div><div class="learned-banner">💚 已掌握 · 已加入学习进度</div><div class="actions"><button class="btn secondary" id="again">🔊 重听台词</button><button class="btn" id="next">下一条 ↑</button></div>`;$('again').onclick=()=>{beep();say(w.w+'. '+d.en)};$('next').onclick=()=>{beep();next()};speakFirst()}}
function next(){spokenFor=-1;if(reviewQueue&&reviewQueue.length){index=reviewQueue.shift();if(!reviewQueue.length)reviewQueue=null}else index=(index+1)%WORDS.length;phase='intro';partIndex=0;wrong=0;turn++;render()}
function tab(id){beep();for(let x of ['learn','library','progress'])$(x).classList.toggle('hidden',x!==id);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='library')renderList();if(id==='progress')renderStats()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function renderList(){let q=$('search').value.trim().toLowerCase();let found=WORDS.map((w,i)=>({...w,i})).filter(w=>w.w.toLowerCase().includes(q)||w.zh.includes(q));$('libraryInfo').textContent=`来自你上传的剑19听力自测表，共 ${WORDS.length} 个去重词条；显示 ${Math.min(found.length,80)} 条。搜索可查全部词汇。`;$('list').innerHTML=found.slice(0,80).map(w=>`<div class="item ${record(w.w).known?"learned":""}"><div><strong>${record(w.w).known?"💚 ":""}${escapeHTML(w.w)}</strong><small>${escapeHTML(w.zh)} · ${escapeHTML(w.group)}</small></div><button class="mini" data-open="${w.i}">学习</button></div>`).join('');$('list').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{index=+b.dataset.open;spokenFor=-1;phase='intro';render();tab('learn')})}
$('search').oninput=renderList;
function renderStats(){let vals=Object.values(saved);$('seenCount').textContent=vals.filter(v=>v.seen>0).length;$('knownCount').textContent=vals.filter(v=>v.known>0).length;$('wrongCount').textContent=vals.filter(v=>v.wrong>0).length;$('streakCount').textContent=streak;$('progressMessage').textContent=`你已经接触 ${vals.filter(v=>v.seen>0).length} 个词，掌握 ${vals.filter(v=>v.known>0).length} 个！累计收集 ${coins} 金币。每一步都值得鼓励！`;pulse()}
$('review').onclick=()=>{let keys=WORDS.map((w,i)=>record(w.w).wrong>0?i:-1).filter(i=>i>=0);if(!keys.length){toast('还没有错词，先去学习吧');return}reviewQueue=keys.slice(1);index=keys[0];spokenFor=-1;phase='intro';render();tab('learn')};$('reset').onclick=()=>{if(confirm('确定清空当前设备的学习记录？')){saved={};streak=0;coins=0;localStorage.setItem('wd_streak','0');localStorage.setItem('wd_coins','0');save();updateSoundUI();renderStats();render()}};
let startY=0;$('scene').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});$('scene').addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>75)next()},{passive:true});render();
</script></body></html>
